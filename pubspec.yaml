name: cargo_voice_agent_offline
description: Flutter Lite Cargo Voice Agent (100% Offline)
publish_to: 'none'
version: 1.0.0+56

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  file_picker: ^10.3.3
  csv: ^6.0.0
  excel: ^4.0.6
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  share_plus: ^10.1.4
  record: ^6.2.1
  sherpa_onnx: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
