name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Membuat file Android yang belum ada (gradle wrapper, settings, res, dll).
      # File yang sudah ada di repo tidak ditimpa.
      - name: Generate missing Android files
        run: |
          flutter create --platforms=android --org com.example --project-name lrt_voice_agent_offline .
          rm -f android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lrt-voice-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
