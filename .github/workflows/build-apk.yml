name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      # Membuat file Android yang belum ada (gradle wrapper, settings, res, dll).
      # File yang sudah ada di repo tidak ditimpa.
      - name: Generate missing Android files
        run: |
          flutter create --platforms=android --org com.example --project-name lrt_voice_agent_offline .
          rm -f android/app/build.gradle.kts test/widget_test.dart

      - run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - run: flutter build apk --release

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --title "LRT Voice Agent APK ${GITHUB_RUN_NUMBER}" \
            --notes "APK otomatis dari commit ${GITHUB_SHA}. Analyze dan test lulus."
