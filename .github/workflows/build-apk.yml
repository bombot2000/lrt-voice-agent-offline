name: Build Cargo Voice Agent APK (No Keystore)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract uploaded source archive when present
        run: |
          set -euo pipefail
          ARCHIVE="lrt-voice-agent-offline-cargo-build-115-patched.zip"
          if [ -f "$ARCHIVE" ]; then
            unzip -q "$ARCHIVE" -d /tmp/cargo-build115
            PROJECT_DIR="$(find /tmp/cargo-build115 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$PROJECT_DIR"
            test -f "$PROJECT_DIR/pubspec.yaml"
            test -f "$PROJECT_DIR/android/app/build.gradle"
            test -f "$PROJECT_DIR/lib/main.dart"
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/workflows/build-apk.yml' \
              --exclude='android/app/build.gradle' \
              --exclude='android/key.properties' \
              --exclude='android/app/*.jks' \
              --exclude='android/app/*.keystore' \
              --exclude='android/*.jks' \
              --exclude='android/*.keystore' \
              "$PROJECT_DIR/" ./
            rm -f "$ARCHIVE"
          fi

      - name: Verify application identity
        run: |
          set -euo pipefail
          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com\.example\.lrt_voice_agent_offline"' android/app/build.gradle
          grep -q '^name: cargo_voice_agent_offline$' pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Generate missing Android Gradle scaffold safely
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ] || [ ! -f android/gradlew ] || [ ! -d android/gradle/wrapper ]; then
            flutter create --platforms=android --project-name=cargo_voice_agent_offline --org=com.example /tmp/cargo-android-scaffold
            mkdir -p android/gradle
            for file in settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties gradlew gradlew.bat; do
              if [ -f "/tmp/cargo-android-scaffold/android/$file" ]; then
                cp "/tmp/cargo-android-scaffold/android/$file" "android/$file"
              fi
            done
            cp -a /tmp/cargo-android-scaffold/android/gradle/wrapper android/gradle/
            mkdir -p android/app/src/main/res
            if [ -d /tmp/cargo-android-scaffold/android/app/src/main/res ]; then
              cp -a /tmp/cargo-android-scaffold/android/app/src/main/res/. android/app/src/main/res/
            fi
            chmod +x android/gradlew
          fi
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml

      - name: Build APK with automatic debug signing
        run: |
          set -euo pipefail
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          TAG="cargo-build-no-keystore-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$APK" \
            --title "NEXT Cargo Voice Agent APK (No Keystore)" \
            --notes "APK release ditandatangani otomatis menggunakan debug keystore runner. Tidak membutuhkan keystore atau Secrets. Application ID: com.example.lrt_voice_agent_offline. Build commit: ${GITHUB_SHA}. Catatan: tanda tangan debug runner tidak dijamin stabil untuk pembaruan lintas build."
