name: Build Cargo Voice Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract uploaded source archive when present
        run: |
          set -euo pipefail
          ARCHIVE="lrt-voice-agent-offline-cargo-build-115-patched.zip"
          if [ -f "$ARCHIVE" ]; then
            unzip -q "$ARCHIVE" -d /tmp/cargo-build115
            PROJECT_DIR="$(find /tmp/cargo-build115 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$PROJECT_DIR"
            test -f "$PROJECT_DIR/pubspec.yaml"
            test -f "$PROJECT_DIR/android/app/build.gradle"
            test -f "$PROJECT_DIR/lib/main.dart"
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/workflows/build-apk.yml' \
              --exclude='android/key.properties' \
              --exclude='android/app/*.jks' \
              --exclude='android/app/*.keystore' \
              --exclude='android/*.jks' \
              --exclude='android/*.keystore' \
              "$PROJECT_DIR/" ./
            rm -f "$ARCHIVE"
          else
            echo "Archive absent; build current repository sources."
          fi

      - name: Verify application identity
        run: |
          set -euo pipefail
          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com\.example\.lrt_voice_agent_offline"' android/app/build.gradle
          grep -q '^name: cargo_voice_agent_offline$' pubspec.yaml
          echo "Application ID and Flutter project identity verified."

      - name: Commit extracted source files to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update NEXT Cargo Voice Agent sources [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Verify permanent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" || -z "${ANDROID_STORE_PASSWORD}" ]]; then
            echo "::error::Permanent signing secrets are incomplete. Build stopped; no debug-signed APK will be published."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release-key.jks
          cat > android/key.properties <<EOF
          storeFile=app/release-key.jks
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storePassword=${ANDROID_STORE_PASSWORD}
          EOF
          echo "Permanent release keystore configured from existing repository secrets."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="cargo-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --title "NEXT Cargo Voice Agent APK" \
            --notes "Analyze dan test berhasil pada commit ${GITHUB_SHA}. APK ditandatangani menggunakan keystore tetap dari repository secrets."
