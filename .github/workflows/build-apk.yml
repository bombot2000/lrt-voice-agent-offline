name: Build Cargo Voice Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract uploaded source archive when present
        run: |
          set -euo pipefail
          ARCHIVE="lrt-voice-agent-offline-cargo-build-115-patched.zip"
          if [ -f "$ARCHIVE" ]; then
            unzip -q "$ARCHIVE" -d /tmp/cargo-build115
            PROJECT_DIR="$(find /tmp/cargo-build115 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$PROJECT_DIR"
            test -f "$PROJECT_DIR/pubspec.yaml"
            test -f "$PROJECT_DIR/android/app/build.gradle"
            test -f "$PROJECT_DIR/lib/main.dart"
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/workflows/build-apk.yml' \
              --exclude='android/key.properties' \
              --exclude='android/app/*.jks' \
              --exclude='android/app/*.keystore' \
              --exclude='android/*.jks' \
              --exclude='android/*.keystore' \
              "$PROJECT_DIR/" ./
            rm -f "$ARCHIVE"
          else
            echo "Archive absent; build current repository sources."
          fi

      - name: Verify application identity
        run: |
          set -euo pipefail
          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com\.example\.lrt_voice_agent_offline"' android/app/build.gradle
          grep -q '^name: cargo_voice_agent_offline$' pubspec.yaml
          echo "Application ID and Flutter project identity verified."

      - name: Commit extracted source files to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update NEXT Cargo Voice Agent sources [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Diagnose legacy Android embedding references
        run: |
          set +e
          echo "Scanning Android project and resolved plugin sources for removed v1 embedding APIs..."
          grep -RInE 'io\.flutter\.app\.(FlutterActivity|FlutterApplication)|PluginRegistry\.Registrar|registerWith\(' android "$HOME/.pub-cache/hosted/pub.dev" 2>/dev/null | head -200 || true
          echo "Resolved Flutter plugins:"
          flutter pub deps --style=compact | head -100

      - name: Generate missing Android Gradle scaffold safely
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ] || [ ! -f android/gradlew ] || [ ! -d android/gradle/wrapper ]; then
            echo "Android Gradle scaffold is incomplete; generating a clean Flutter Android scaffold."
            flutter create --platforms=android --project-name=cargo_voice_agent_offline --org=com.example /tmp/cargo-android-scaffold
            mkdir -p android/gradle
            for file in settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties gradlew gradlew.bat; do
              if [ -f "/tmp/cargo-android-scaffold/android/$file" ]; then
                cp "/tmp/cargo-android-scaffold/android/$file" "android/$file"
              fi
            done
            cp -a /tmp/cargo-android-scaffold/android/gradle/wrapper android/gradle/
            # Restore only the standard Android resource set required by the existing manifest.
            mkdir -p android/app/src/main/res
            if [ -d /tmp/cargo-android-scaffold/android/app/src/main/res ]; then
              cp -a /tmp/cargo-android-scaffold/android/app/src/main/res/. android/app/src/main/res/
            fi
            chmod +x android/gradlew
          fi
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            echo "Missing Gradle settings file (Groovy or Kotlin DSL)." >&2
            exit 1
          fi
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml
          echo "Android Gradle scaffold and v2 embedding metadata are present."

      - name: Build release APK
        run: |
          set -euo pipefail
          # Maven Central may temporarily rate-limit hosted runners (HTTP 429).
          # Retry with backoff; keep the same unsigned build configuration.
          for attempt in 1 2 3 4; do
            echo "APK build attempt $attempt/4"
            if flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "APK build failed after 4 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Locate unsigned release APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"

      - name: Publish unsigned APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="cargo-build-unsigned-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --title "NEXT Cargo Voice Agent APK (Unsigned)" \
            --notes "APK release tanpa keystore/signing permanen. Analyze dan test dijalankan pada commit ${GITHUB_SHA}."
