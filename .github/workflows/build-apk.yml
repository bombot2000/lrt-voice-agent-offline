name: Activate Cargo Voice Agent Build 54

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract uploaded Build 54 and replace repository sources
        run: |
          set -euo pipefail
          ARCHIVE="cargo-voice-agent-offline-build-54-preserve-package.zip"
          test -s "$ARCHIVE"
          unzip -q "$ARCHIVE" -d /tmp/cargo-build54
          PROJECT_DIR="$(find /tmp/cargo-build54 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/android/app/build.gradle"
          test -f "$PROJECT_DIR/lib/main.dart"
          rsync -a --delete --exclude='.git/' "$PROJECT_DIR/" ./
          rm -f "$ARCHIVE"

      - name: Commit extracted Build 54 sources to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Replace LRT app with NEXT Cargo Voice Agent Build 54 [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Generate missing Android project files
        run: |
          flutter create --platforms=android --org com.example --project-name cargo_voice_agent_offline .
          rm -f android/app/build.gradle.kts test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="cargo-build-54-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --title "NEXT Cargo Voice Agent Build 54" \
            --notes "Build 54. Analyze dan test dijalankan pada commit ${GITHUB_SHA}. Tanda tangan debug; cocokkan sertifikat sebelum memasang sebagai pembaruan. Jangan uninstall aplikasi lama.";
