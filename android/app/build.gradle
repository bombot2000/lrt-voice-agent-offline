plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.cargo_voice_agent_offline"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Identitas paket tetap dipertahankan.
        applicationId = "com.example.lrt_voice_agent_offline"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Gunakan debug keystore otomatis milik runner GitHub Actions.
            // Tidak memerlukan file JKS atau GitHub Secrets.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
